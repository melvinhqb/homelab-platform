# Smoke test for encrypted secrets: deploys one SOPS-encrypted Secret.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sops-check
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/melvinhqb/homelab-platform.git
    targetRevision: main
    path: platform/sops-check
  destination:
    server: https://kubernetes.default.svc
    namespace: sops-check
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
