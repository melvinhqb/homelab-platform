# Adds the KSOPS binary to the repo server. ArgoCD keeps its own kustomize:
# the one bundled with the KSOPS image (v5.3.0) is older and panics on the
# $patch: delete patches in remove-unused-components.yaml.
# The age private key comes from the `sops-age` secret, created by
# `make sops-key` from the workstation: it is never stored in Git.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-repo-server
spec:
  template:
    spec:
      volumes:
        - name: custom-tools
          emptyDir: {}
        - name: sops-age
          secret:
            secretName: sops-age
            # Lets ArgoCD start before the key is loaded; decryption fails until then.
            optional: true
      initContainers:
        - name: install-ksops
          image: viaductoss/ksops:v4.5.1
          command: ["/usr/local/bin/ksops", "install", "/custom-tools"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: custom-tools
              mountPath: /custom-tools
      containers:
        - name: argocd-repo-server
          env:
            - name: SOPS_AGE_KEY_FILE
              value: /sops-age/keys.txt
          volumeMounts:
            - name: custom-tools
              mountPath: /usr/local/bin/ksops
              subPath: ksops
            - name: sops-age
              mountPath: /sops-age
              readOnly: true
