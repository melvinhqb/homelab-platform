apiVersion: apps/v1
kind: Deployment
metadata:
  name: shortlink
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: shortlink
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shortlink
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: shortlink
          # Set with tag and digest by the overlay.
          image: ghcr.io/melvinhqb/shortlink
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: shortlink
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: shortlink-db
                  key: password
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 512Mi
          # The JVM starts slowly on this hardware: give it up to 2.5 minutes.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
