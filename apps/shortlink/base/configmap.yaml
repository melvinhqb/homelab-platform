apiVersion: v1
kind: ConfigMap
metadata:
  name: shortlink
data:
  DB_URL: jdbc:postgresql://postgres:5432/shortlink
  DB_USERNAME: shortlink
  # Public URL, used to build shortUrl and to detect redirect loops.
  # localhost until the app is exposed through Cloudflare Tunnel (M5).
  SHORTLINK_BASE_URL: http://localhost:8080
  SHORTLINK_BLOCKED_DOMAINS: ""
  # Heap at half the memory limit: the rest goes to metaspace, threads and code cache.
  JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=50 -XX:+ExitOnOutOfMemoryError -Djava.io.tmpdir=/tmp
