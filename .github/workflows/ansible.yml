name: Ansible

on:
  pull_request:
    paths:
      - "ansible/**"
      - ".github/workflows/ansible.yml"
  push:
    branches: [main]
    paths:
      - "ansible/**"
      - ".github/workflows/ansible.yml"

permissions:
  contents: read

jobs:
  lint:
    name: ansible-lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ansible
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ansible-lint
        run: pip install ansible-core ansible-lint

      - name: ansible-lint
        run: ansible-lint playbooks/site.yml roles/
